name: Release

# A version tag (v*) builds the static binaries and the runtime image, publishes the image to
# GitHub Container Registry with build provenance, and creates a GitHub release with the
# binaries and their checksums. Run it by hand (workflow_dispatch) to rehearse the build
# without publishing anything (also when it is started on a tag: only a tag push publishes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the rehearsal build (nothing is published)
        default: rehearsal
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOAMD64: v1
  GOTOOLCHAIN: local
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'rehearsal' }}

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26" # latest patch: go.mod only sets the minimum, the toolchain must carry the stdlib fixes
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      # The same tests CI runs: a tag is never released from an untested tree.
      - name: Tests
        run: go test -tags nogui -count=1 ./cmd/... ./internal/... ./web/...
      - name: Build
        run: make binaries VERSION="$VERSION"
      - name: Package
        run: |
          mkdir release
          cp dist/workbench "release/workbench-${VERSION}-linux-amd64"
          cp dist/magpie "release/magpie-${VERSION}-linux-amd64"
          (cd release && sha256sum ./* > SHA256SUMS)
          "release/workbench-${VERSION}-linux-amd64" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: release
          retention-days: 14
          if-no-files-found: error

  image:
    name: image
    # Nothing is pushed unless the tests and the binaries passed.
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Registry names are lowercase; the repository owner is not (the metadata action lowercases
      # the tags it builds, so the smoke test and the attestation must use the same name).
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false # the raw rule below decides: never for a prerelease (v1.2.3-rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=raw,value=rehearsal,enable=${{ github.event_name != 'push' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image that is about to ship
        if: github.event_name != 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: scripts/ci/smoke-image.sh "${IMAGE}:rehearsal"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    if: github.event_name == 'push'
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$TAG"
