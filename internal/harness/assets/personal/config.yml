# Native OMP personal profile. Repository context may come only from .omp/.
# Model roles are selected through this host's Magpie configuration.
setupVersion: 2

advisor:
  enabled: false
prewalk:
  enabled: false
extendedContext: true
compaction:
  enabled: true
  # With the 1M extended window this triggers near 400K tokens.
  thresholdPercent: 40
  thresholdTokens: -1
  keepRecentTokens: 32000
  dropUseless: true

retry:
  maxRetries: 3
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  fallbackRevertPolicy: cooldown-expiry

extensions: []
disabledProviders:
  - agents
  - agents-md
  - agent-plugins
  - claude
  - claude-plugins
  - codex
  - gemini
  - github
  - mcp-json
  - opencode
  - ssh-json
  - vscode
  - windsurf
  - cursor
  - cline
  - openai-codex

mcp:
  enableProjectConfig: false

browser:
  enabled: true
  relay: true
  headless: true
  cmux: false

memory:
  backend: off

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

skills:
  enabled: true
  enableSkillCommands: true
  enableAgentsProject: false
  enableAgentsUser: false
  enableClaudeProject: false
  enableClaudeUser: false
  enableCodexUser: false
  enablePiUser: false
  enablePiProject: true
  customDirectories: []
  includeSkills: []
  # Ponytail's default extension stays active, but its optional user skills do not load.
  ignoredSkills:
    - ponytail
    - ponytail-audit
    - ponytail-debt
    - ponytail-gain
    - ponytail-help
    - ponytail-review

task:
  eager: preferred
  batch: true
  showResolvedModelBadge: true
  maxConcurrency: 2
  maxRecursionDepth: 1
  enableLsp: false
  softRequestBudget: 24
  maxEffort: medium
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    librarian: "@smol"
    reviewer: "@slow"
    security-reviewer: "@slow"
  agentPrewalk:
    task: "off"
    scout: "off"
    librarian: "off"
    reviewer: "off"
    security-reviewer: "off"
